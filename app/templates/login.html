{% extends "auth_base.html" %}
{% block auth_form %}
<h2 class="mt-8 text-2xl font-bold tracking-tight">Sign in</h2>
<p class="mt-1 text-sm text-slate-500">Welcome back. Sign in to your PGMS account.</p>

{% if notice %}
<div role="status" class="mt-6 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">
    {{ notice }}
</div>
{% endif %}

{% if error %}
<div role="alert" class="mt-6 flex items-start gap-2 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    <svg class="mt-0.5 h-4 w-4 flex-none" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/>
    </svg>
    <span>{{ error }}</span>
</div>
{% endif %}

<form data-auth-form action="/login" method="POST" class="mt-6 space-y-5">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

    <div>
        <label for="username" class="block text-sm font-medium text-slate-700">Username</label>
        <input id="username" name="username" type="text" value="{{ username }}" required
            autocomplete="username" autocapitalize="none" spellcheck="false" {% if not username %}autofocus{% endif %}
            class="mt-1.5 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 shadow-sm focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-700/20">
    </div>

    <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <div class="relative mt-1.5">
            <input id="password" name="password" type="password" required
                autocomplete="current-password" {% if username %}autofocus{% endif %}
                class="block w-full rounded-lg border border-slate-300 bg-white py-2.5 pl-3 pr-16 shadow-sm focus:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-700/20">
            <button type="button" data-password-toggle aria-controls="password" aria-pressed="false"
                class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-blue-800 hover:text-blue-950 focus:outline-none focus-visible:underline">
                Show
            </button>
        </div>
    </div>

    <button type="submit" data-busy-label="Signing in&hellip;"
        class="flex w-full items-center justify-center rounded-lg bg-blue-900 px-4 py-2.5 font-semibold text-white shadow-sm hover:bg-blue-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-900 focus-visible:ring-offset-2 disabled:cursor-wait disabled:opacity-70">
        Sign in
    </button>
</form>

<p class="mt-8 text-center text-sm text-slate-500">
    New to PGMS? <a href="/signup" class="font-medium text-blue-800 hover:text-blue-950 hover:underline">Create an account</a>
</p>
{% endblock %}
